name: Assessment Service CI
on:
  push:
    paths: ["services/assessment/**", "scenarios/**", ".github/workflows/assessment-ci.yml"]
  pull_request:
    paths: ["services/assessment/**", "scenarios/**", ".github/workflows/assessment-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assessment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/assessment/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Check Python correctness
        run: ruff check app tests --select F
      - name: Type check
        run: mypy app
      - name: Run tests
        run: pytest
